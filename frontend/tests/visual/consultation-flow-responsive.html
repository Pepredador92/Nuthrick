<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consulta · Revisión adaptable</title>
  <style>
    body { margin: 0; padding: 16px; background: #e7eeeb; color: #243d3b; font: 14px Arial, sans-serif; }
    header { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    button { padding: 9px 14px; border: 1px solid #b9ccc2; border-radius: 8px; background: white; color: inherit; cursor: pointer; }
    iframe { display: block; width: 390px; max-width: 100%; height: 720px; margin: auto; border: 1px solid #b9ccc2; border-radius: 16px; background: white; }
    output { display: block; text-align: center; margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <header><strong>Consulta · Datos de demostración</strong><button data-width="390">Móvil · 390 px</button><button data-width="768">Tableta · 768 px</button><button data-width="1280">Escritorio · 1280 px</button></header>
  <iframe title="Consulta adaptable" src="/tests/visual/consultation-flow.html?clinical-design=1"></iframe>
  <output aria-live="polite"></output>
  <script>
    const frame = document.querySelector('iframe');
    const report = () => {
      const page = frame.contentDocument?.documentElement;
      if (page) document.querySelector('output').textContent = `Ancho disponible: ${page.clientWidth} px · Ancho del contenido: ${page.scrollWidth} px`;
    };
    document.querySelectorAll('button').forEach(button => button.addEventListener('click', () => { frame.style.width = `${button.dataset.width}px`; requestAnimationFrame(report); }));
    frame.addEventListener('load', () => { report(); new MutationObserver(report).observe(frame.contentDocument.body, { childList: true, subtree: true, attributes: true }); });
  </script>
</body>
</html>
